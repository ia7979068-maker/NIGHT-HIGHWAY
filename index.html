<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NIGHT HIGHWAY - 夜間高速回避ラン</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05070a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 100vh;
      max-height: 750px;
      background: #0a0d14;
      border: 2px solid #00e5ff;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 92%;
      font-size: 13px;
      font-weight: bold;
      color: #7b8c9e;
      z-index: 10;
      background: rgba(10, 13, 20, 0.9);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid #1e293b;
    }
    .hud-val {
      color: #00e5ff;
      font-size: 16px;
    }
    canvas {
      width: 100%;
      height: 420px;
      display: block;
      background: #080b11;
      touch-action: none;
      border-top: 2px solid #1e293b;
      border-bottom: 2px solid #1e293b;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 92%;
      gap: 10px;
      z-index: 10;
    }
    .btn {
      height: 58px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      color: #fff;
      background: #1e293b;
      border: 1px solid #334155;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      touch-action: manipulation;
    }
    .btn:active {
      background: #00e5ff;
      color: #000;
      transform: translateY(2px);
    }
    .btn-nitro {
      grid-column: span 2;
      height: 48px;
      background: linear-gradient(135deg, #ff0055, #990033);
      border: 1px solid #ff3377;
    }
    .btn-nitro:active {
      background: #ff0055;
    }
    .msg-box {
      z-index: 10;
      text-align: center;
    }
    .msg {
      font-size: 13px;
      color: #00e5ff;
      font-weight: bold;
    }
    .bmc-link {
      color: #ffdd00;
      text-decoration: none;
      font-size: 11px;
      background: rgba(255, 221, 0, 0.12);
      border: 1px solid #ffdd00;
      padding: 4px 12px;
      border-radius: 12px;
      box-shadow: 0 0 8px rgba(255, 221, 0, 0.2);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div>SCORE: <span id="score-val" class="hud-val">0</span> m</div>
      <div>SPEED: <span id="speed-val" class="hud-val">120</span> km/h</div>
      <div>BEST: <span id="best-val" class="hud-val">0</span></div>
    </div>

    <canvas id="cv" width="400" height="420"></canvas>

    <div class="msg-box">
      <div class="msg" id="msg">タップしてSoundスタート！障害物を回避せよ</div>
    </div>

    <div class="controls">
      <button class="btn" id="btn-left">◀ ◀ LEFT</button>
      <button class="btn" id="btn-right">RIGHT ▶ ▶</button>
      <button class="btn btn-nitro" id="btn-nitro">⚡ NITRO BOOST (加速)</button>
    </div>

    <a href="https://www.buymeacoffee.com/yos999" target="_blank" rel="noopener noreferrer" class="bmc-link">
      ☕ Support
    </a>
  </div>

  <script>
    // --- Web Audio サウンドエンジン ---
    const SoundEngine = {
      ctx: null,
      bgmTimer: null,
      bgmStep: 0,
      isBgmPlaying: false,

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        if (!this.isBgmPlaying) {
          this.startBGM();
        }
      },

      // 夜の高速ドライブ風シンセベースBGM
      startBGM() {
        this.isBgmPlaying = true;
        const notes = [65.41, 65.41, 87.31, 65.41, 77.78, 65.41, 87.31, 98.00]; // C2ベース
        this.bgmTimer = setInterval(() => {
          if (!this.ctx || !isPlaying) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(notes[this.bgmStep % notes.length], now);
            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.18);
            this.bgmStep++;
          } catch(e) {}
        }, 180);
      },

      // SE: 高速走行エンジン音
      playEngine(speedRatio) {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(80 + speedRatio * 120, now);
          gain.gain.setValueAtTime(0.02, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        } catch(e) {}
      },

      // SE: ニトロブースト音
      playNitro() {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(800, now + 0.15);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch(e) {}
      },

      // SE: 激突クラッシュ音
      playCrash() {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        } catch(e) {}
      }
    };

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    let score = 0;
    let bestScore = 0;
    let speed = 120;
    let baseSpeed = 120;
    let isPlaying = true;
    let roadOffsetY = 0;

    // 車線データ (4車線)
    const lanes = [80, 160, 240, 320];

    // プレイヤー車両
    const player = {
      x: lanes[1],
      targetX: lanes[1],
      y: 330,
      w: 32,
      h: 56,
      laneIndex: 1
    };

    // 他車（NPCトラフィック）
    let trafficCars = [];

    function spawnTraffic() {
      const laneIdx = Math.floor(Math.random() * lanes.length);
      // 同じ車線に重ならないように生成
      const existInLane = trafficCars.some(c => c.laneIndex === laneIdx && c.y < 120);
      if (!existInLane) {
        trafficCars.push({
          x: lanes[laneIdx],
          y: -80,
          w: 32,
          h: 56,
          speed: 40 + Math.random() * 40,
          laneIndex: laneIdx,
          color: ['#ff3366', '#3388ff', '#ffaa00', '#00ffcc'][Math.floor(Math.random() * 4)]
        });
      }
    }

    function resetGame() {
      score = 0;
      speed = baseSpeed;
      player.laneIndex = 1;
      player.x = lanes[1];
      player.targetX = lanes[1];
      trafficCars = [];
      isPlaying = true;
      document.getElementById('score-val').innerText = '0';
      document.getElementById('speed-val').innerText = Math.floor(speed);
      document.getElementById('msg').innerText = 'ナイトドライブ開始！ 車線を変更して回避せよ';
    }

    // ボタンリスナー
    const bindBtn = (id, action) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); SoundEngine.init(); action(); });
      el.addEventListener('mousedown', () => { SoundEngine.init(); action(); });
    };

    bindBtn('btn-left', () => {
      if (player.laneIndex > 0) {
        player.laneIndex--;
        player.targetX = lanes[player.laneIndex];
      }
    });

    bindBtn('btn-right', () => {
      if (player.laneIndex < lanes.length - 1) {
        player.laneIndex++;
        player.targetX = lanes[player.laneIndex];
      }
    });

    // ニトロブースト
    const btnNitro = document.getElementById('btn-nitro');
    const startNitro = () => {
      if (isPlaying) {
        speed = 220;
        SoundEngine.playNitro();
      }
    };
    const endNitro = () => { speed = baseSpeed; };

    btnNitro.addEventListener('touchstart', (e) => { e.preventDefault(); SoundEngine.init(); startNitro(); });
    btnNitro.addEventListener('touchend', (e) => { e.preventDefault(); endNitro(); });
    btnNitro.addEventListener('mousedown', () => { SoundEngine.init(); startNitro(); });
    btnNitro.addEventListener('mouseup', endNitro);

    window.addEventListener('keydown', (e) => {
      SoundEngine.init();
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        if (player.laneIndex > 0) {
          player.laneIndex--;
          player.targetX = lanes[player.laneIndex];
        }
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        if (player.laneIndex < lanes.length - 1) {
          player.laneIndex++;
          player.targetX = lanes[player.laneIndex];
        }
      }
      if (e.code === 'Space' || e.code === 'ShiftLeft') startNitro();
      if (!isPlaying && e.code === 'KeyR') resetGame();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' || e.code === 'ShiftLeft') endNitro();
    });

    cv.addEventListener('click', () => {
      SoundEngine.init();
      if (!isPlaying) resetGame();
    });

    function update() {
      if (!isPlaying) return;

      // スコアとスピード加算
      score += Math.floor(speed / 30);
      document.getElementById('score-val').innerText = score;
      document.getElementById('speed-val').innerText = Math.floor(speed);

      if (score > bestScore) {
        bestScore = score;
        document.getElementById('best-val').innerText = bestScore;
      }

      // 車線変更のスムーズな補間移動
      player.x += (player.targetX - player.x) * 0.25;

      // 道路白線のスクロール
      roadOffsetY += speed * 0.12;
      if (roadOffsetY > 40) roadOffsetY = 0;

      // 他車（トラフィック）の湧き出し制御
      if (Math.random() < 0.04) {
        spawnTraffic();
      }

      // トラフィックの移動と衝突判定
      for (let i = trafficCars.length - 1; i >= 0; i--) {
        let c = trafficCars[i];
        // 相対速度で接近
        const relativeSpeed = (speed - c.speed) * 0.08;
        c.y += relativeSpeed;

        // 衝突判定 (Box Collision)
        if (Math.abs(player.x - c.x) < 26 && Math.abs(player.y - c.y) < 48) {
          SoundEngine.playCrash();
          isPlaying = false;
          document.getElementById('msg').innerText = 'CRASH! クラッシュ発生！ (タップでリトライ)';
        }

        // 画面外に流れたら削除
        if (c.y > cv.height + 60) {
          trafficCars.splice(i, 1);
        }
      }

      SoundEngine.playEngine(speed / 220);
    }

    function render() {
      // 道路背景
      ctx.fillStyle = '#0a0e17';
      ctx.fillRect(0, 0, cv.width, cv.height);

      // 道路両脇のアスファルト境界線
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(35, 0, 8, cv.height);
      ctx.fillRect(357, 0, 8, cv.height);

      // 車線破線（3本）
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 3;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -roadOffsetY;

      [120, 200, 280].forEach(x => {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, cv.height);
        ctx.stroke();
      });
      ctx.setLineDash([]);

      // 1. NPC車両描画（リアランプ照り返し）
      trafficCars.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);

        // リアテールランプの赤い光
        ctx.fillStyle = 'rgba(255, 0, 85, 0.4)';
        ctx.beginPath();
        ctx.arc(-10, 24, 12, 0, Math.PI * 2);
        ctx.arc(10, 24, 12, 0, Math.PI * 2);
        ctx.fill();

        // 車体
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);

        // ルーフ
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-c.w/2 + 4, -c.h/2 + 12, c.w - 8, c.h - 24);

        ctx.restore();
      });

      // 2. プレイヤー車両描画（ヘッドライト照射）
      ctx.save();
      ctx.translate(player.x, player.y);

      // 夜間ヘッドライトの光錐
      const lightGrad = ctx.createLinearGradient(0, 0, 0, -180);
      lightGrad.addColorStop(0, 'rgba(0, 229, 255, 0.5)');
      lightGrad.addColorStop(1, 'rgba(0, 229, 255, 0.0)');
      ctx.fillStyle = lightGrad;
      ctx.beginPath();
      ctx.moveTo(-10, -20);
      ctx.lineTo(-50, -180);
      ctx.lineTo(50, -180);
      ctx.lineTo(10, -20);
      ctx.closePath();
      ctx.fill();

      // ニトロブースト時のバック火花エフェクト
      if (speed > 180) {
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.arc(-8, player.h/2 + 6, 6 + Math.random()*4, 0, Math.PI * 2);
        ctx.arc(8, player.h/2 + 6, 6 + Math.random()*4, 0, Math.PI * 2);
        ctx.fill();
      }

      // プレイヤー車体本体
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);

      // キャビン・ルーフ
      ctx.fillStyle = '#0a0d14';
      ctx.fillRect(-player.w/2 + 4, -player.h/2 + 14, player.w - 8, player.h - 24);

      ctx.restore();
    }

    resetGame();

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
